name: macOS desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'TermLume/**'
      - 'TermLume.Backend/**'
      - 'desktop/**'
      - 'tests/**'
      - 'vendor/packages/**'
      - 'NuGet.config'
      - '.github/workflows/macos.yml'

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: |
          python -m pip install paramiko==4.0.0
          npm ci --prefix desktop
      - name: Frontend and desktop security regressions
        run: |
          node --test tests/snippets.test.cjs
          npm --prefix desktop test
      - name: SSH and SFTP regressions
        run: dotnet run --project tests/TermLume.PortableTests -c Release -r osx-${{ matrix.architecture }}
      - name: Stdio bridge integration
        run: npm --prefix desktop run test:backend
      - name: Isolated native desktop smoke test
        run: npm --prefix desktop run test:desktop
      - name: Build macOS installers
        run: npm --prefix desktop run dist:mac:${{ matrix.architecture }}
      - uses: actions/upload-artifact@v4
        with:
          name: TermLume-macOS-${{ matrix.architecture }}
          path: |
            artifacts/*.dmg
            artifacts/*.zip
          if-no-files-found: error
          retention-days: 14
