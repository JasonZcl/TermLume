<!doctype html>
<html lang="{{LANGUAGE}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{{TITLE}} · TermLume</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='15' fill='%23818cf8'/%3E%3Cpath d='m18 22 11 10-11 10' fill='none' stroke='white' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M35 42h11' stroke='%23a9f5db' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>{{STYLES}}</style>
</head>
<body data-state="{{STATE}}">
  <div class="page-shell">
    <header class="page-header">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <defs><linearGradient id="brand-surface" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse"><stop stop-color="#8492ff"/><stop offset="1" stop-color="#7753d5"/></linearGradient></defs>
          <rect x="4" y="4" width="56" height="56" rx="15" fill="url(#brand-surface)"/>
          <rect x="5" y="5" width="54" height="54" rx="14" stroke="#c5cbff" stroke-opacity=".35"/>
          <path d="m18 22 11 10-11 10" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M35 42h11" stroke="#a9f5db" stroke-width="5" stroke-linecap="round"/>
        </svg>
        <span>TermLume</span>
      </div>
      <span class="page-context">{{CONTEXT}}</span>
    </header>
    <main>
      <section class="callback-card" aria-labelledby="heading">
        <div class="terminal-art" aria-hidden="true">
          <div class="terminal-frame">
            <div class="terminal-dots"><i></i><i></i><i></i></div>
            <svg viewBox="0 0 72 38" fill="none"><path d="m14 8 12 11-12 11" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M37 30h17" stroke="#a9f5db" stroke-width="4" stroke-linecap="round"/></svg>
          </div>
          <div class="result-mark">
            <svg class="received-icon" viewBox="0 0 24 24" fill="none"><path d="m6 12 4 4 8-8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg class="attention-icon" viewBox="0 0 24 24" fill="none"><path d="M12 6v7m0 4v.1" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
          </div>
        </div>
        <div class="status-label"><span></span>{{STATUS}}</div>
        <h1 id="heading">{{TITLE}}</h1>
        <p class="description">{{DESCRIPTION}}</p>
        <div class="next-step">
          <span class="app-symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="4" stroke="currentColor" stroke-width="1.5"/><path d="m7 9 3 3-3 3m6 0h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <div class="step-copy"><strong>{{CONTINUE}}</strong><span>{{SWITCH}}</span></div>
          <div class="shortcut" aria-hidden="true"><kbd>{{MODIFIER}}</kbd><span>+</span><kbd>Tab</kbd></div>
        </div>
        <button id="close-page" type="button">{{CLOSE}}<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m8 8 8 8m0-8-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        <p id="close-hint" class="close-hint" role="status">{{HINT}}</p>
      </section>
      <div class="provider"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m12 3 7 3v5c0 5-7 10-7 10S5 16 5 11V6l7-3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="m9 11 2 2 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Aegis-IAM</span><span class="provider-divider"></span><span>{{CONTEXT}}</span></div>
    </main>
    <footer>{{FOOTER}}</footer>
  </div>
  <script>{{SCRIPT}}</script>
</body>
</html>
