<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>TermLume</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="settings.css">
  <link rel="stylesheet" href="sftp.css">
  <script src="vendor/xterm.js" defer></script>
  <script src="vendor/addon-fit.js" defer></script>
  <script src="platform.js" defer></script>
  <script src="i18n.js" defer></script>
  <script src="activity.js" defer></script>
  <script src="preferences.js" defer></script>
  <script src="settings.js" defer></script>
  <script src="sftp.js" defer></script>
  <script src="snippets.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
<svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
  <symbol id="i-transfer" viewBox="0 0 24 24"><path d="M4 8h16m-4-4 4 4-4 4M20 16H4m4-4-4 4 4 4"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 16v5h16v-5"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v13m-5-5 5 5 5-5M4 17v4h16v-4"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 10a8 8 0 1 0-1 7M20 4v6h-6"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 20V4m-6 6 6-6 6 6"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H5v18h14V8Zm0 0v5h5M8 13h8m-8 4h6"/></symbol>
  <symbol id="i-computer" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="13" rx="2"/><path d="M12 16v5m-5 0h10"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="m10 13 4-4m-6 7-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m2 1 1-1a4 4 0 1 1 6 6l-4 4a4 4 0 0 1-6 0"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-terminal" viewBox="0 0 24 24"><path d="m5 7 5 5-5 5m8 0h6"/></symbol>
  <symbol id="i-server" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="8" rx="2"/><rect x="3" y="13" width="18" height="8" rx="2"/><path d="M7 7h.01M7 17h.01M12 7h5m-5 10h5"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.3.9-4.55 4.45 1.07 6.25L12 17.35l-5.62 2.95 1.07-6.25L2.9 9.6l6.3-.9Z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-code" viewBox="0 0 24 24"><path d="m7 6-5 6 5 6m10-12 5 6-5 6M14 3l-4 18"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="m9 3-.6 2.4-2 .9L4 5.5 2 9l1.8 1.7v2.6L2 15l2 3.5 2.4-.8 2 .9L9 21h6l.6-2.4 2-.9 2.4.8 2-3.5-1.8-1.7v-2.6L22 9l-2-3.5-2.4.8-2-.9L15 3Z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3Z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="8" r="5"/><path d="m11.5 11.5 9 9m-5-5 3-3m0 6 3-3"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="m15 4 5 5M4 20l5-1L21 7a2 2 0 0 0-5-5L4 14Z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M15 8V3H3v13h5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="m13 2-9 12h7l-1 8 10-12h-7Z"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Z"/><path d="m8 12 3 3 5-6"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
  <symbol id="i-minimize" viewBox="0 0 24 24"><path d="M6 12h12"/></symbol>
  <symbol id="i-maximize" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></symbol>
  <symbol id="i-restore" viewBox="0 0 24 24"><path d="M9 6V3h12v12h-3"/><rect x="3" y="9" width="12" height="12" rx="1"/></symbol>
  <symbol id="i-sort" viewBox="0 0 24 24"><path d="M8 4v16m-4-4 4 4 4-4m4-12h4m-4 4h3m-3 4h2"/></symbol>
</defs></svg>
<div class="app-shell">
  <header class="window-titlebar">
    <button class="icon-button sidebar-toggle" data-action="toggleSidebar" title="收起 / 展开侧栏" aria-label="收起或展开侧栏" aria-expanded="true"><svg class="icon"><use href="#i-menu"/></svg></button>
    <div class="tabbar" id="tabbar" role="tablist" aria-label="终端标签"></div>
    <button class="icon-button titlebar-add" data-action="openTerminal" title="打开终端" aria-label="打开终端"><svg class="icon"><use href="#i-plus"/></svg></button>
    <div class="titlebar-drag-space"></div>
    <span class="window-brand">TermLume</span>
    <div class="window-controls">
      <button data-action="minimize" title="最小化" aria-label="最小化"><svg class="icon"><use href="#i-minimize"/></svg></button>
      <button data-action="maximize" title="最大化" aria-label="最大化" id="maximize-window"><svg class="icon"><use href="#i-maximize"/></svg></button>
      <button data-action="closeWindow" title="关闭窗口" aria-label="关闭窗口"><svg class="icon"><use href="#i-close"/></svg></button>
    </div>
  </header>
  <aside class="sidebar">
    <nav id="navigation" aria-label="主导航">
      <button class="nav-item active" data-view="hosts"><svg class="icon"><use href="#i-server"/></svg><span>所有主机</span><span class="nav-count" id="host-count">0</span></button>
      <button class="nav-item" data-view="favorites"><svg class="icon"><use href="#i-star"/></svg><span>收藏夹</span></button>
      <button class="nav-item" data-view="recent"><svg class="icon"><use href="#i-clock"/></svg><span>最近连接</span></button>
      <button class="nav-item" data-view="sftp"><svg class="icon"><use href="#i-transfer"/></svg><span>SFTP</span><span class="tiny-tag">FILES</span></button>
      <button class="nav-item" data-view="snippets"><svg class="icon"><use href="#i-code"/></svg><span>命令片段</span><span class="tiny-tag">SNIP</span></button>
      <button class="nav-item" data-view="knownHosts"><svg class="icon"><use href="#i-shield"/></svg><span>已知主机</span></button>
      <button class="nav-item" data-view="logs"><svg class="icon"><use href="#i-clock"/></svg><span>日志</span></button>
    </nav>
    <div class="nav-label group-label"><span>主机分组</span><button class="icon-button" data-action="newGroup" title="新建分组" aria-label="新建分组"><svg class="icon"><use href="#i-plus"/></svg></button></div>
    <div id="groups" class="groups"></div>
    <div class="sidebar-bottom"><div class="local-note"><svg class="icon"><use href="#i-lock"/></svg><div><strong>本地工作空间</strong><p>配置只保存在此设备</p></div></div><button class="nav-item" data-view="settings"><svg class="icon"><use href="#i-settings"/></svg><span>设置</span><span class="version">v0.7.3</span></button></div>
  </aside>
  <main class="main">
    <span class="sr-only" id="breadcrumb-label">所有主机</span>
    <div class="page-scroll" id="page-scroll"><div id="page" class="page"></div></div>
    <section class="terminal-workspace hidden" id="terminal-workspace" aria-label="SSH 终端">
      <div class="terminal-toolbar"><span id="terminal-endpoint"></span><div><span id="terminal-state"></span><button class="subtle-button" data-action="toggleSnippets" aria-controls="terminal-snippets" aria-expanded="false"><svg class="icon"><use href="#i-code"/></svg>命令片段</button><button class="subtle-button" data-action="reconnect" id="reconnect-button">重新连接</button><button class="icon-button" data-action="clearTerminal" title="清空终端显示" aria-label="清空终端显示"><svg class="icon"><use href="#i-trash"/></svg></button><button class="subtle-button" data-action="disconnect">断开连接</button></div></div>
      <div class="terminal-body"><div id="terminals"></div><aside id="terminal-snippets" class="hidden" aria-label="命令片段"></aside></div>
    </section>
    <footer class="statusbar"><span><span class="status-dot"></span><span id="footer-status">工作空间就绪</span></span><span id="footer-right">SSH · 端到端加密连接</span></footer>
  </main>
</div>
<dialog id="editor-dialog"><form id="editor-form"></form></dialog>
<dialog id="confirm-dialog"><div class="dialog-heading"><div><div class="eyebrow">PLEASE CONFIRM</div><h2 id="confirm-title"></h2></div></div><p id="confirm-description" class="confirm-description"></p><div class="dialog-footer"><button class="secondary-button" id="confirm-cancel">取消</button><button class="primary-button" id="confirm-accept">确认</button></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
